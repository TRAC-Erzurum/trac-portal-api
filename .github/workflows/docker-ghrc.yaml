name: Build & Push to GHCR

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

jobs:
  build-and-push-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker tags
        id: docker_tags
        run: |
          BUILD_NUM=${{ github.run_number }}
          ORG_NAME=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            API_TAGS="ghcr.io/${ORG_NAME}/${REPO_NAME}:${VERSION} ghcr.io/${ORG_NAME}/${REPO_NAME}:latest"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            API_TAGS=""
            VERSION=pr
          else
            VERSION=pre-release
            API_TAGS="ghcr.io/${ORG_NAME}/${REPO_NAME}:master-build.${BUILD_NUM} ghcr.io/${ORG_NAME}/${REPO_NAME}:pre-release"
          fi

          echo "api_tags=${API_TAGS}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Pull pre-release image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ORG_NAME=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          docker pull ghcr.io/${ORG_NAME}/${REPO_NAME}:pre-release
          docker tag ghcr.io/${ORG_NAME}/${REPO_NAME}:pre-release temp-api-image

      - name: Build API Image
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'pull_request'
        run: |
          docker build --no-cache --build-arg VERSION=${{ steps.docker_tags.outputs.version }} -t temp-api-image .

      - name: Tag and Push API Image
        if: github.event_name != 'pull_request' && steps.docker_tags.outputs.api_tags != ''
        run: |
          for TAG in ${{ steps.docker_tags.outputs.api_tags }}; do
            docker tag temp-api-image $TAG
            docker push $TAG
          done
